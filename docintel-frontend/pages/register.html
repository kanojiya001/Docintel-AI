<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | DocIntel AI</title>
  <link rel="icon" type="image/svg+xml" href="../images/logo.svg"/>
  <link rel="stylesheet" href="../css/styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body { background: var(--neutral-soft); min-height: 100vh; display: flex; flex-direction: column; }
    .register-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.5rem 3rem;
    }
    .register-main {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;
    }
    .register-card {
      width: 100%; max-width: 480px;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl), 0 0 0 1px rgba(85,53,32,0.03);
      padding: 2rem 3rem;
      animation: scaleIn 0.5s ease;
    }
    .password-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .strength-bar {
      display: flex; gap: 0.25rem; margin-top: 0.5rem;
    }
    .strength-segment {
      flex: 1; height: 3px; border-radius: 2px; background: #e2e8f0;
      transition: background 0.3s ease;
    }
    .strength-segment.active { background: #059669; }
    .strength-segment.medium { background: #f59e0b; }
    .strength-segment.weak { background: #ef4444; }
    .terms-check {
      display: flex; align-items: flex-start; gap: 0.75rem; cursor: pointer;
    }
    .terms-check input { margin-top: 0.125rem; width: 1rem; height: 1rem; accent-color: var(--primary); }
    .terms-text { font-size: 0.75rem; color: #64748b; line-height: 1.5; }
    .terms-text a { color: var(--primary); font-weight: 600; }
    .register-footer { padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <header class="register-header anim-fade-down">
    <div class="flex items-center gap-3">
      <div style="width:2.5rem;height:2.5rem;display:flex;align-items:center;justify-content:center;">
        <img src="../images/logo.svg" alt="DocIntel AI" style="width:2.5rem;height:2.5rem;object-fit:contain;"/>
      </div>
      <h2 style="font-size:1.25rem;font-weight:800;color:var(--primary);letter-spacing:-0.02em;">DocIntel AI</h2>
    </div>
    <div class="flex items-center gap-4" style="display:none;" id="header-links">
      <span style="font-size:0.875rem;color:#475569;">Already have an account?</span>
      <a href="login.html" style="font-size:0.875rem;font-weight:700;color:var(--primary);">Log in</a>
    </div>
  </header>

  <main class="register-main">
    <div class="register-card">
      <div style="margin-bottom:2rem;" class="anim-fade-up">
        <h1 style="font-size:1.875rem;font-weight:800;color:#0f172a;letter-spacing:-0.02em;margin-bottom:0.5rem;">Create your account</h1>
        <p style="color:#64748b;font-size:0.875rem;line-height:1.6;">Experience the power of enterprise AI built for modern documentation workflows.</p>
      </div>
      <form id="register-form" style="display:flex;flex-direction:column;gap:1.25rem;" onsubmit="return handleRegister(event)">
        <div class="input-group anim-fade-up delay-1">
          <label>Full Name</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined">person</span>
            <input class="input-field" type="text" placeholder="John Doe" required/>
          </div>
        </div>
        <div class="input-group anim-fade-up delay-2">
          <label>Email Address</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined">mail</span>
            <input class="input-field" type="email" placeholder="email@company.com" required/>
          </div>
        </div>
        <div class="password-grid anim-fade-up delay-3">
          <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined">lock</span>
              <input class="input-field" type="password" placeholder="••••••••" id="reg-password" required oninput="checkStrength(this.value)"/>
            </div>
          </div>
          <div class="input-group">
            <label>Confirm</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined">verified_user</span>
              <input class="input-field" type="password" placeholder="••••••••" required/>
            </div>
          </div>
        </div>
        <div class="strength-bar" id="strength-bar">
          <div class="strength-segment"></div>
          <div class="strength-segment"></div>
          <div class="strength-segment"></div>
          <div class="strength-segment"></div>
        </div>
        <div class="anim-fade-up delay-4" style="padding-top:0.5rem;">
          <label class="terms-check">
            <input type="checkbox" required/>
            <span class="terms-text">
              I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a> including cookie usage.
            </span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-ripple anim-fade-up delay-5" style="width:100%;padding:1rem;margin-top:0.75rem;font-size:0.9375rem;">
          <span>Create Account</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </form>
      <div style="margin-top:2rem;padding-top:2rem;border-top:1px solid #f1f5f9;text-align:center;">
        <p style="color:#64748b;font-size:0.875rem;">
          Already using DocIntel AI? <a href="login.html" style="color:var(--primary);font-weight:700;">Log in to your workspace</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="register-footer">
    <p style="color:#94a3b8;font-size:0.75rem;letter-spacing:0.05em;">© 2024 DocIntel AI. Trusted by Fortune 500 companies globally.</p>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';
  if (window.innerWidth > 768) document.getElementById('header-links').style.display = 'flex';

  function checkStrength(val) {
    const segs = document.querySelectorAll('#strength-bar .strength-segment');
    segs.forEach(s => s.className = 'strength-segment');
    const score = (val.length >= 8 ? 1 : 0) + (/[A-Z]/.test(val) ? 1 : 0) + (/[0-9]/.test(val) ? 1 : 0) + (/[^A-Za-z0-9]/.test(val) ? 1 : 0);
    for (let i = 0; i < score; i++) {
      segs[i].classList.add(score <= 1 ? 'weak' : score <= 2 ? 'medium' : 'active');
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const form     = e.target;
    const fullName = form.querySelector('input[type=text]').value;
    const email    = form.querySelector('input[type=email]').value;
    const password = document.getElementById('reg-password').value;
    const btn      = form.querySelector('button[type=submit]');
    btn.disabled   = true;
    try {
      await Auth.register(email, password, fullName, null);
      showNotification('Account created! Redirecting…', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    } catch (err) {
      showNotification(err.message || 'Registration failed', 'error');
      btn.disabled = false;
    }
    return false;
  }
</script>
</body>
</html>
